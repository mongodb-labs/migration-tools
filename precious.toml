# When adding new tidiers, consider what labels it should have. If it's fast, set labels like this:
#
#     labels = [ "default", "fast-tidy" ]
#
# "Fast" here means anything less than 0.1s. These tidiers are intended to be invoked frequently,
# for example from editors on save. Slower tidiers should only be invoked manually, either by
# running the relevant mage command or by explicitly running `precious` from the CLI.

exclude = [
    "vendor/**",
]

[commands.golangci-lint]
type = "both"
include = "**/*.go"
# Based on my local testing, this seemed like a reasonable value for this option.
invoke.per-dir-or-once = 7
working-dir = "root"
path-args = "dir"
cmd = [
    "mise", "exec", "github:golangci/golangci-lint", "--",
    "golangci-lint",
    "run",
    "--allow-parallel-runners",
    "--color", "always",
    "--timeout", "5m",
]
tidy-flags = "--fix"
ok-exit-codes = [0]
lint-failure-exit-codes = [1]
ignore-stderr = 'Skipped \d+ issues by rules:'

[commands."golangci-lint formatting"]
# golangci-lint will lint formatting failures when run with the `run` flag, per the above config.
type = "tidy"
include = "*.go"
invoke.per-dir-or-once = 7
working-dir = "root"
path-args = "dir"
cmd = [
    "mise", "exec", "github:golangci/golangci-lint", "--",
    "golangci-lint",
    "fmt",
    "--color", "always",
]
ok-exit-codes = [0]
lint-failure-exit-codes = [1]
labels = [ "default", "fast-tidy" ]

[commands."go fix"]
type = "both"
include = "*.go"
invoke.per-dir-or-once = 7
working-dir = "root"
# What we really want is something like "dir-with-dot" so we get paths like "./verifier" instead of
# "verifier", but absolute paths work okay. See
# https://github.com/houseabsolute/precious/issues/104.
path-args = "absolute-dir"
cmd = [ "mise", "exec", "go", "--", "go", "fix", "-tags", "mstests,ruleguard" ]
lint-flags = "-diff"
ok-exit-codes = 0
lint-failure-exit-codes = 1
labels = [ "default", "fast-tidy" ]

# We could run this via golangci-lint but we want to exclude more directories
# for gosec than we do for other linting. There doesn't seem to be a way to
# configure these excludes when running gosec as part of golangci-lint.
[commands.gosec]
type = "lint"
include = "**/*.go"
exclude = [
    "cmd/**/*.go",
]
invoke = "once"
working-dir = "root"
path-args = "dir"
# This wrapper lets us control the output with an env var so we can generate a
# SARIF report in Evergreen but use the default format for linting.
cmd = [ "$PRECIOUS_ROOT/etc/gosec-wrapper.sh", "-severity", "high", "-terse" ]
ok-exit-codes = [0]
lint-failure-exit-codes = [1]

[commands.prettier-yaml]
type = "both"
invoke = "once"
working-dir = "root"
path-args = "file"
include = [ "**/*.yml", "**/*.yaml" ]
cmd = [ "mise", "exec", "npm:prettier", "--", "prettier" ]
lint-flags = "--check"
tidy-flags = "--write"
ok-exit-codes = [0]
lint-failure-exit-codes = [1]
ignore-stderr = ".*"

[commands.prettier-json]
type = "both"
invoke = "once"
working-dir = "root"
path-args = "file"
include = [ "**/*.json", "**/*.json" ]
cmd = [ "mise", "exec", "npm:prettier", "--", "prettier" ]
lint-flags = "--check"
tidy-flags = "--write"
ok-exit-codes = [0]
lint-failure-exit-codes = [1]
ignore-stderr = ".*"

[commands.prettier-md]
type = "both"
invoke = "once"
working-dir = "root"
path-args = "file"
include = [ "*.md" ]
cmd = [
    "mise", "exec", "npm:prettier", "--",
    "prettier",
    "--print-width", "100",
    "--prose-wrap", "always",
]
lint-flags = "--check"
tidy-flags = "--write"
ok-exit-codes = [0]
lint-failure-exit-codes = [1]
ignore-stderr = ".*"

[commands.omegasort-gitignore]
type = "both"
include = "**/.gitignore"
cmd = [ "mise", "exec", "github:houseabsolute/omegasort", "--", "omegasort", "--sort=path", "--comment-prefix=# ", "--unique" ]
lint-flags = "--check"
tidy-flags = "--in-place"
ok-exit-codes = 0
lint-failure-exit-codes = 1
ignore-stderr = ".*"

[commands.shellcheck]
type = "lint"
include = "**/*.sh"
cmd = [ "mise", "exec", "github:koalaman/shellcheck", "--", "shellcheck", "--color=always", "--external-sources" ]
ok-exit-codes = 0
lint-failure-exit-codes = 1

[commands.shfmt]
type = "both"
include = "**/*.sh"
cmd = [ "mise", "exec", "github:mvdan/sh", "--", "shfmt", "--simplify", "--indent", "4" ]
lint-flags = "--diff"
tidy-flags = "--write"
ok-exit-codes = 0
lint-failure-exit-codes = 1

[commands.github-codeowners]
type = "lint"
invoke = "once"
path-args = "none"
# We need to run this whenever new files are added to make sure they have an owner, so it's easiest
# to just apply this linter to all files.
include = "**/*"
cmd = [ "$PRECIOUS_ROOT/etc/github-codeowners-wrapper.sh" ]
ok-exit-codes = 0
lint-failure-exit-codes = 1

[commands.typos]
type = "both"
include = "**/*"
exclude = [
    ".golangci.yml",
    ".mailmap",
    "go.mod",
]
cmd = [ "typos", "--sort" ]
tidy-flags = "--write-changes"
invoke = "once"
ok-exit-codes = 0
lint-failure-exit-codes = 2

[commands.zizmor]
type = "lint"
include = ".github/**/*.yml"
invoke = "once"
path-args = "none"
working-dir = "root"
cmd = [ "mise", "exec", "zizmor", "--", "zizmor", "--persona", "pedantic", "." ]
ok-exit-codes = 0
# zizmor exits with 11-14 depending on the severity of the worst finding. Every
# other non-zero code means zizmor itself failed - 1 for an audit error, 2 for
# bad arguments, 3 for collecting no inputs at all - and none of those are lint
# failures, so precious should treat them as hard errors.
lint-failure-exit-codes = [11, 12, 13, 14]
expect-stderr = true
