# We use github for nearly everything we can for two reasons. One is consistency. This way we don't
# have two developers who compile a Go package with different Go versions. The other is that it's
# the fastest way to install these packages. In many cases, these tools are available in the mise
# registry with multiple backends, so spelling out "github:..." ensures we use the github backend.
[tools]
# Go stuff
go = "1.26.8"
"go:golang.org/x/tools/cmd/goimports" = "0.50.0"
"go:golang.org/x/tools/gopls" = "0.23.0"
"github:golangci/golangci-lint" = "2.13.2"
"github:golangci/golines" = "0.16.0"
"github:securego/gosec" = "2.29.0"
"github:zizmorcore/zizmor" = "1.30.1"

# Other stuff
node = { version = "26.8.2", postinstall = "$MISE_TOOL_INSTALL_PATH/bin/npm install --loglevel verbose" }
"npm:github-codeowners" = "0.2.1"
# This is just a Rust binary, but the version released on GitHub doesn't include the same features
# as the NPM version for some mysterious reason. https://github.com/oxc-project/oxc/issues/18836
"npm:oxfmt" = "0.68.0"
"github:crate-ci/typos" = "1.50.1"
"github:houseabsolute/omegasort" = "0.2.1"
"github:houseabsolute/precious" = "0.12.0"
"github:koalaman/shellcheck" = "0.11.0"
"github:mvdan/sh" = { version = "3.14.1", bin = "shfmt" }

[hooks]
# This exists for the sake of worktrees, since we need to run `npm install` in every new worktree.
enter = "./etc/maybe-run-npm-install.sh"

[settings]
# This prevents us from upgrade to anything that was released less than 7 days ago. It gives us a
# bit of protection against supply-chain attacks.
minimum_release_age = "7d"

[settings.npm]
# Since 2026.9.x, mise's default npm backend installs each package into a pnpm-style store of
# symlinks (`<install>/node_modules/.mise/<pkg>@<ver>/...`). Evergreen's `cache.save` dereferences
# symlinks, which mangles that tree: the restored copy has, e.g., oxfmt's `tinypool` dependency as
# a directory whose contents are gone, so oxfmt dies with ERR_MODULE_NOT_FOUND. Shelling out to npm
# restores the old `<install>/lib/node_modules/<pkg>` layout, whose only symlinks are the bin shims
# that evergreen/scripts/install-mise-managed-tools.sh already recreates after a cache restore.
shell_out = true

[settings.node]
# We turn off GPG verification for node because it has been flaky in CI, and also requires a local
# GPG public key.
gpg_verify = false
