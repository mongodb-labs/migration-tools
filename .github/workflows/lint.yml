name: Lint

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Optional: allow read access to pull request. Use with `only-new-issues` option.
  # pull-requests: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools with `mise`
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          # This matches what we use in the mongosync and mongo-tools repos.
          version: 2026.9.4

      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: npm-cache
        with:
          path: node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}

      # This installs the NPM tools we use for linting.
      - name: Run `npm ci` to install node tools
        run: npm ci
        if: steps.npm-cache.outputs.cache-hit != 'true'

      - name: Run `precious lint -a`
        run: precious lint -a

      - name: Ensure `THIRD-PARTY-NOTICES` is up to date
        run: |
          go run ./cmd/third-party-notices/
          git diff --exit-code
