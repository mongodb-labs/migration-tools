name: Lint

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Optional: allow read access to pull request. Use with `only-new-issues` option.
  # pull-requests: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install tools with `mise`
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          # This matches what we use in the mongosync and mongo-tools repos.
          version: 2026.2.19
      - name: Cache node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: npm-cache
        with:
          path: node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
      # This installs the NPM tools we use for linting.
      - name: Run `npm ci` to install node tools
        run: npm ci
        if: steps.npm-cache.outputs.cache-hit != 'true'
      - name: Run `precious lint -a`
        run: precious lint -a
      - name: Ensure `THIRD-PARTY-NOTICES` is up to date
        run: |
          go run ./cmd/third-party-notices/
          git diff --exit-code
